[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diet_classifier"
version = "0.1.0"
description = "DIET Classifier - Dual Intent and Entity Transformer in PyTorch"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "torch==2.5.1",   
    "pyyaml",
    "matplotlib",
    "scikit-learn",
    "numpy",
    "fastapi",
    "uvicorn"
]

# Index CPU
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# Index CUDA 13.0
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "extra == 'cuda'" },
    { index = "pytorch-cpu",   marker = "extra == 'cpu'" },
]

[project.optional-dependencies]
cuda = ["torch==2.5.1"]
cpu  = ["torch==2.5.1"]

[tool.setuptools.packages.find]
where = ["src"]